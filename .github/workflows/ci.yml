name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  action:
    name: L'action, sur des skills d'essai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Une skill correcte passe, même en mode strict
        uses: ./
        with:
          chemins: test/fixtures/skills/bonne
          strict: "true"
      - name: Une skill piégée est bloquée en mode strict
        id: trapped
        uses: ./
        continue-on-error: true
        with:
          chemins: test/fixtures/skills/piegee
          strict: "true"
      - name: Vérifier que la skill piégée a bien été bloquée
        if: steps.trapped.outcome != 'failure'
        shell: bash
        run: |
          echo "::error title=Olympe::la skill piégée aurait dû faire échouer l'action."
          exit 1

  titre:
    name: Titre de PR (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: Carolinedanslesnuages/constance/titre-pr@v1

  taille:
    name: Taille des fichiers (une responsabilité par fichier)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Carolinedanslesnuages/constance/taille-fichiers@v1

  dependances:
    name: Dépendances (Madeleine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Carolinedanslesnuages/madeleine@v1

  nommage:
    name: Nommage des fichiers (kebab-case, PascalCase.vue)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Carolinedanslesnuages/constance/nommage-fichiers@v1

  resume:
    name: Résumé pour la relecture (Annie)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: Carolinedanslesnuages/annie@v1

  anti-fuite:
    name: Anti-fuite (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: Carolinedanslesnuages/constance/anti-fuite@v1
